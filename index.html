<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/svg+xml" href="/favicon.ico" /> -->
  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thaiseva restaurant and food-order management portal." />
  <title>Thaiseva | Food Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="antialiased" style="margin:0;background:#f8fafc;">
  <div id="root">
    <!-- Visible before JS/auth bootstraps (avoids pure white flash) -->
    <div id="boot-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f8fafc;">
      <div style="display:flex;gap:8px;align-items:center;justify-content:center;height:64px;">
        <span style="width:12px;height:12px;border-radius:50%;background-color:#0ea5e9;animation:boot-bounce 1s infinite;animation-delay:0ms;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background-color:#0ea5e9;animation:boot-bounce 1s infinite;animation-delay:150ms;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background-color:#0ea5e9;animation:boot-bounce 1s infinite;animation-delay:300ms;"></span>
      </div>
    </div>
    <style>@keyframes boot-bounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(0.8,0,1,1)}50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,0.2,1)}}</style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
